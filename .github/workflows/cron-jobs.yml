name: Scheduled data refresh

# Heavy scrapes run on GitHub runners (saves Vercel Fluid Active CPU).
# Secrets: FIREBASE_SERVICE_ACCOUNT, SITE_URL, CRON_SECRET, optional FIRECRAWL_API_KEY
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
    - cron: "15 4 * * *"
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
    - cron: "0 2 * * *"
    - cron: "30 3 * * 0"
    - cron: "45 5 * * *"
    - cron: "30 6 * * *"
    - cron: "45 6 * * *"
  workflow_dispatch: {}

jobs:
  sync-ats-jobs:
    if: github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Sync ATS boards on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
          CRON_TIME_BUDGET_MS: "600000"
          CRON_CONCURRENCY: "6"
        run: node scripts/gh-cron.mjs sync-ats-jobs

  # Downstream jobs use !cancelled() so one failed scrape doesn't block the rest.
  check-hiring:
    needs: sync-ats-jobs
    if: ${{ !cancelled() && (github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Check hiring on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_ACTIONS: "true"
          CRON_TIME_BUDGET_MS: "600000"
          CRON_CONCURRENCY: "4"
          LIMIT: "40"
        run: node scripts/gh-cron.mjs check-hiring

  sync-priority-careers:
    needs: check-hiring
    if: ${{ !cancelled() && (github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Sync priority careers on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_ACTIONS: "true"
          CRON_TIME_BUDGET_MS: "600000"
          CRON_CONCURRENCY: "4"
        run: node scripts/gh-cron.mjs sync-priority-careers

  rebuild-overlay:
    needs: sync-priority-careers
    if: ${{ !cancelled() && (github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Rebuild overlay rollup on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs rebuild-overlay

  fetch-news:
    if: github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call fetch-news on Vercel
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL missing"; exit 0; fi
          curl -sf --max-time 35 -X GET "$SITE_URL/api/cron/fetch-news?limit=20" \
            -H "Authorization: Bearer $CRON_SECRET" || true

  # Evening (18:00) pull runs alone, no bust; next morning's bust publishes it.
  adzuna-jobs:
    needs: [rebuild-overlay, sync-healthcare-jobs]
    if: ${{ !cancelled() && (github.event.schedule == '30 2 * * *' || github.event.schedule == '0 18 * * *') }}
    runs-on: ubuntu-latest
    steps:
      - name: Call adzuna-jobs on Vercel
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL missing"; exit 0; fi
          curl -s --max-time 25 -X GET "$SITE_URL/api/cron/adzuna-jobs" \
            -H "Authorization: Bearer $CRON_SECRET" || true

  # One cache bust per day. Busting a tag invalidates every ISR page built from
  # that data, and each crawled long-tail page then re-renders on its next visit,
  # so every extra bust costs a near full-site re-render (CPU + ISR writes +
  # origin transfer). Never add busts to individual scrapes; this is the only one.
  bump-cache:
    needs: [sync-ats-jobs, check-hiring, sync-priority-careers, rebuild-overlay, adzuna-jobs, sync-empleos-jobs, sync-direct-jobs, sync-healthcare-jobs]
    if: ${{ !cancelled() && (github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Bust public-jobs and startups-dynamic once
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL missing"; exit 0; fi
          curl -sf --max-time 15 -X GET "$SITE_URL/api/cron/bump-cache?tags=public-jobs,startups-dynamic" \
            -H "Authorization: Bearer $CRON_SECRET"

  sync-empleos-jobs:
    needs: adzuna-jobs
    if: ${{ !cancelled() && (github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-empleos-jobs on Vercel
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL missing"; exit 0; fi
          curl -s --max-time 25 -X GET "$SITE_URL/api/cron/sync-empleos-jobs" \
            -H "Authorization: Bearer $CRON_SECRET" || true

  sync-direct-jobs:
    needs: adzuna-jobs
    if: ${{ !cancelled() && (github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-direct-jobs (Amazon, JPMorgan) on Vercel
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL missing"; exit 0; fi
          curl -s --max-time 28 -X GET "$SITE_URL/api/cron/sync-direct-jobs" \
            -H "Authorization: Bearer $CRON_SECRET" || true

  sync-healthcare-jobs:
    needs: sync-priority-careers
    if: ${{ !cancelled() && (github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Sync healthcare jobs on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs sync-healthcare-jobs

  job-alerts:
    if: github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call job-alerts on Vercel
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL missing"; exit 0; fi
          curl -s --max-time 25 -X GET "$SITE_URL/api/cron/job-alerts" \
            -H "Authorization: Bearer $CRON_SECRET" || true

  newsletter:
    if: github.event.schedule == '30 3 * * 0'
    runs-on: ubuntu-latest
    steps:
      - name: Call newsletter on Vercel
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL missing"; exit 0; fi
          curl -sf --max-time 35 -X GET "$SITE_URL/api/cron/newsletter" \
            -H "Authorization: Bearer $CRON_SECRET" || true
