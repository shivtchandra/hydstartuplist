name: Scheduled data refresh

# Consolidated data scrapers running sequentially on a single runner to conserve GitHub Actions minutes.
# Secrets: FIREBASE_SERVICE_ACCOUNT, SITE_URL, CRON_SECRET, optional FIRECRAWL_API_KEY
on:
  schedule:
    # Daily scrape backup at 01:17 UTC (06:47 IST).
    - cron: "17 1 * * *"
    - cron: "0 5 * * *"
    - cron: "0 2 * * *"
    - cron: "30 3 * * 0"
  # Dispatched on time daily by Cloudflare api-worker at 00:30 UTC (06:00 IST).
  workflow_dispatch:
    inputs:
      scope:
        description: "full = every scraper; jobs = job feeds only (no Firecrawl)"
        type: choice
        options: [full, jobs]
        default: full
      force:
        description: "Scrape even if another scrape ran in the last 30 min"
        type: boolean
        default: false

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 1 * * *') && 'scrape' || format('cron-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 1 * * *'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          repo="${{ github.repository }}"
          ids=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            any_since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            ids=$(gh run list -R "$repo" --workflow cron-jobs.yml --limit 100 --created ">=$any_since" --json databaseId,conclusion,event,createdAt \
              -q ".[] | select(.conclusion != \"failure\" and .conclusion != \"cancelled\") | .databaseId") || ids=""
          elif [ "${{ inputs.force }}" != "true" ]; then
            since=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            ids=$(gh run list -R "$repo" --workflow cron-jobs.yml --limit 100 --created ">=$since" --json databaseId,conclusion \
              -q '.[] | select(.conclusion != "failure" and .conclusion != "cancelled") | .databaseId') || ids=""
          fi
          for id in $ids; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            n=$(gh run view "$id" -R "$repo" --json jobs \
              -q '[.jobs[] | select((.name == "scrape-data" or .name == "sync-ats-jobs") and .conclusion != "skipped" and .conclusion != "failure" and .conclusion != "cancelled")] | length') || n=0
            if [ "${n:-0}" -gt 0 ]; then run=false; echo "scrape run $id already covers this slot"; break; fi
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "scrape: run=$run"

  scrape-data:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Sync ATS boards
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
          CRON_TIME_BUDGET_MS: "600000"
          CRON_CONCURRENCY: "6"
        run: node scripts/gh-cron.mjs sync-ats-jobs

      - name: Check hiring
        if: ${{ github.event.inputs.scope != 'jobs' }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_ACTIONS: "true"
          CRON_TIME_BUDGET_MS: "600000"
          CRON_CONCURRENCY: "4"
          LIMIT: "40"
        run: node scripts/gh-cron.mjs check-hiring

      - name: Sync priority careers
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PRIORITY_FIRECRAWL: ${{ github.event.inputs.scope == 'jobs' && '0' || '1' }}
          GITHUB_ACTIONS: "true"
          CRON_TIME_BUDGET_MS: "600000"
          CRON_CONCURRENCY: "4"
        run: node scripts/gh-cron.mjs sync-priority-careers

      - name: Sync healthcare jobs
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs sync-healthcare-jobs

      - name: Pull Adzuna jobs
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          if [ -n "$ADZUNA_APP_ID" ] && [ -n "$ADZUNA_APP_KEY" ]; then
            node scripts/gh-cron.mjs adzuna-jobs
          else
            echo "ADZUNA_* secrets missing on GitHub; running on Vercel instead"
            curl -s --max-time 25 -X GET "$SITE_URL/api/cron/adzuna-jobs" -H "Authorization: Bearer $CRON_SECRET" || true
          fi

      - name: Sync direct jobs (Amazon, JPMorgan)
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs sync-direct-jobs

      - name: Rebuild overlay rollup
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs rebuild-overlay

  fetch-news:
    if: github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fetch news on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs fetch-news limit=60

  job-alerts:
    if: github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Send job alerts on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TOKEN_SECRET: ${{ secrets.ALERT_TOKEN_SECRET }}
          ALERTS_ENABLED: ${{ secrets.ALERTS_ENABLED }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs job-alerts

  newsletter:
    if: github.event.schedule == '30 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Send newsletter on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs newsletter

  radar-links:
    if: github.event.schedule == '30 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/verify-radar-links.mjs
