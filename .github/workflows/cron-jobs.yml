name: Scheduled data refresh

# Heavy scrapes run on GitHub runners (saves Vercel Fluid Active CPU).
# Secrets: FIREBASE_SERVICE_ACCOUNT, SITE_URL, CRON_SECRET, optional FIRECRAWL_API_KEY
on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "0 5 * * *"
    - cron: "0 2 * * *"
    - cron: "30 3 * * 0"
  # Vercel Cron dispatches the scrape every 6h (vercel.json): 00:30 UTC with
  # scope=full, 06:30/12:30/18:30 with scope=jobs. "jobs" skips check-hiring and
  # sync-priority-careers, which spend Firecrawl credits, so they stay once a day.
  workflow_dispatch:
    inputs:
      scope:
        description: "full = every scraper; jobs = job feeds only (no Firecrawl)"
        type: choice
        options: [full, jobs]
        default: full

# Morning-scrape runs (dispatch or the '30 2' backup) queue behind each other instead of
# scraping in parallel. Other schedules get a per-run group so they never queue or get
# replaced as a pending run.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *') && 'morning-scrape' || format('cron-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # The morning scrape has two triggers. Vercel Cron dispatches it on time
  # (/api/cron/dispatch-scrape, 00:30 UTC); GitHub's '30 2' schedule, which fires
  # 6-7h late, is the backup and stands down when a dispatch already ran today.
  # If the gh lookup itself fails, run anyway: a duplicate scrape beats a missed day.
  gate:
    if: github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list -R "${{ github.repository }}" --workflow cron-jobs.yml --event workflow_dispatch \
              --created ">=$(date -u +%F)" --json conclusion \
              -q '[.[] | select(.conclusion != "failure" and .conclusion != "cancelled")] | length') || n=0
            [ "${n:-0}" -gt 0 ] && run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "morning scrape: run=$run"

  sync-ats-jobs:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Sync ATS boards on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
          CRON_TIME_BUDGET_MS: "600000"
          CRON_CONCURRENCY: "6"
        run: node scripts/gh-cron.mjs sync-ats-jobs

  # Downstream jobs use !cancelled() so one failed scrape doesn't block the rest.
  check-hiring:
    needs: [gate, sync-ats-jobs]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && github.event.inputs.scope != 'jobs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Check hiring on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_ACTIONS: "true"
          CRON_TIME_BUDGET_MS: "600000"
          CRON_CONCURRENCY: "4"
          LIMIT: "40"
        run: node scripts/gh-cron.mjs check-hiring

  sync-priority-careers:
    needs: [gate, check-hiring]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && github.event.inputs.scope != 'jobs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Sync priority careers on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_ACTIONS: "true"
          CRON_TIME_BUDGET_MS: "600000"
          CRON_CONCURRENCY: "4"
        run: node scripts/gh-cron.mjs sync-priority-careers

  rebuild-overlay:
    needs: [gate, sync-priority-careers]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Rebuild overlay rollup on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs rebuild-overlay

  fetch-news:
    if: github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Ran on Vercel at limit=20 to fit its 30s cap; no cap on a GitHub runner.
      - name: Fetch news on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs fetch-news limit=60

  adzuna-jobs:
    needs: [gate, rebuild-overlay, sync-healthcare-jobs]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Pull Adzuna jobs on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GITHUB_ACTIONS: "true"
        # Falls back to the Vercel route until the Adzuna keys are added as
        # GitHub secrets (they only exist in Vercel's env today).
        run: |
          if [ -n "$ADZUNA_APP_ID" ] && [ -n "$ADZUNA_APP_KEY" ]; then
            node scripts/gh-cron.mjs adzuna-jobs
          else
            echo "ADZUNA_* secrets missing on GitHub; running on Vercel instead"
            curl -s --max-time 25 -X GET "$SITE_URL/api/cron/adzuna-jobs" -H "Authorization: Bearer $CRON_SECRET" || true
          fi

  # One cache bust per day. Busting a tag invalidates every ISR page built from
  # that data, and each crawled long-tail page then re-renders on its next visit,
  # so every extra bust costs a near full-site re-render (CPU + ISR writes +
  # origin transfer). Never add busts to individual scrapes; this is the only one.
  bump-cache:
    needs: [gate, sync-ats-jobs, check-hiring, sync-priority-careers, rebuild-overlay, adzuna-jobs, sync-empleos-jobs, sync-direct-jobs, sync-healthcare-jobs]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Bust public-jobs and startups-dynamic once
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # This bust is what publishes the day's scrape; a single failed request
        # used to leave the site on old data, so retry before giving up.
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL missing"; exit 0; fi
          curl -sf --retry 4 --retry-all-errors --retry-delay 15 --max-time 15 -X GET "$SITE_URL/api/cron/bump-cache?tags=public-jobs,startups-dynamic" \
            -H "Authorization: Bearer $CRON_SECRET"

  sync-empleos-jobs:
    needs: [gate, adzuna-jobs]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Sync empleos jobs on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs sync-empleos-jobs

  sync-direct-jobs:
    needs: [gate, adzuna-jobs]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Sync direct jobs (Amazon, JPMorgan) on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs sync-direct-jobs

  sync-healthcare-jobs:
    needs: [gate, sync-priority-careers]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Sync healthcare jobs on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs sync-healthcare-jobs

  job-alerts:
    if: github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Email env (RESEND_API_KEY, ALERT_TOKEN_SECRET...) isn't set anywhere yet,
      # so this reports enabled:false, same as it did on Vercel.
      - name: Send job alerts on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TOKEN_SECRET: ${{ secrets.ALERT_TOKEN_SECRET }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs job-alerts

  newsletter:
    if: github.event.schedule == '30 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Send newsletter on GitHub runner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: node scripts/gh-cron.mjs newsletter

  # Weekly Radar careers-link check. Runs only on GitHub (no Vercel cost);
  # a dead link fails the job, so GitHub's failure email is the alert.
  radar-links:
    if: github.event.schedule == '30 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/verify-radar-links.mjs
