name: Scheduled data refresh

# Triggers the same cron API routes on the deployed Vercel app.
# Kept sparse on purpose — each call burns Vercel Fluid Active CPU (Hobby limit).
# GitHub Actions secrets:
#   SITE_URL     — deployed origin, e.g. https://startups.mapmyhyd.com
#   CRON_SECRET  — same value as CRON_SECRET on Vercel
on:
  schedule:
    - cron: "30 2 * * *"   # sync-ats-jobs once/day ~8:00 IST
    - cron: "0 3 * * *"    # check-hiring once/day
    - cron: "15 4 * * *"   # sync-priority-careers once/day
    - cron: "0 5 * * *"    # fetch-news once/day
    - cron: "0 6 * * *"    # adzuna morning
    - cron: "0 18 * * *"   # adzuna evening
    - cron: "0 2 * * *"    # job-alerts near IST morning digest window
    - cron: "30 3 * * 0"   # newsletter Sundays
    - cron: "45 5 * * *"   # rebuild-overlay once/day
  workflow_dispatch: {}

jobs:

  sync-ats-jobs:
    if: github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-ats-jobs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping."
            exit 0
          fi
          curl -s --max-time 35 -X GET "$SITE_URL/api/cron/sync-ats-jobs" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || true

  check-hiring:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call check-hiring
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping."
            exit 0
          fi
          # Smaller batch + short budget to protect Fluid Active CPU.
          curl -s --max-time 35 -X GET "$SITE_URL/api/cron/check-hiring?limit=15" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || true

  fetch-news:
    if: github.event.schedule == '0 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call fetch-news
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping."
            exit 0
          fi
          curl -sf --max-time 35 -X GET "$SITE_URL/api/cron/fetch-news?limit=20" \
            -H "Authorization: Bearer $CRON_SECRET" || true

  adzuna-jobs:
    if: github.event.schedule == '0 6 * * *' || github.event.schedule == '0 18 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call adzuna-jobs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping."
            exit 0
          fi
          curl -s --max-time 25 -X GET "$SITE_URL/api/cron/adzuna-jobs" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || true

  sync-priority-careers:
    if: github.event.schedule == '15 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-priority-careers
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping."
            exit 0
          fi
          curl -s --max-time 35 -X GET "$SITE_URL/api/cron/sync-priority-careers" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || true

  job-alerts:
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call job-alerts
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping."
            exit 0
          fi
          curl -s --max-time 25 -X GET "$SITE_URL/api/cron/job-alerts" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || true

  newsletter:
    if: github.event.schedule == '30 3 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call newsletter digest
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping."
            exit 0
          fi
          curl -sf --max-time 35 -X GET "$SITE_URL/api/cron/newsletter" \
            -H "Authorization: Bearer $CRON_SECRET" || true

  rebuild-overlay:
    if: github.event.schedule == '45 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild startups_dynamic rollup
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping."
            exit 0
          fi
          curl -s --max-time 35 -X GET "$SITE_URL/api/cron/rebuild-overlay" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || true
