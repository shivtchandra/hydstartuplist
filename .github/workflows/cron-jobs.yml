name: Scheduled data refresh

# Triggers the same cron API routes Vercel Cron calls (see vercel.json) —
# GitHub Actions has no cap on scheduled-workflow count and no cost on a
# public repo, so this runs alongside (or instead of) Vercel Cron if the
# Vercel plan's cron limit is a problem. Needs two repo secrets:
#   SITE_URL     — the deployed site's origin, e.g. https://yourdomain.com
#   CRON_SECRET  — same value as the CRON_SECRET env var set in Vercel
on:
  schedule:
    - cron: "30 2 * * *"   # sync-ats-jobs morning (~8:00 IST)
    - cron: "30 14 * * *"  # sync-ats-jobs evening (~8:00 IST)
    - cron: "0 3 * * *"    # check-hiring morning (~8:30 IST)
    - cron: "0 15 * * *"   # check-hiring evening (~8:30 IST)
    - cron: "0 4 * * *"    # fetch-news, 4am UTC
    - cron: "15 4 * * *"   # sync-priority-careers daily (~9:45 IST)
    - cron: "0 */2 * * *"  # adzuna-jobs every 2h (no Adzuna webhooks; poll for new)
    - cron: "30 3 * * 0"   # newsletter, Sundays 3:30am UTC
  workflow_dispatch: {}    # manual "Run workflow" button for one-off triggers

jobs:

  sync-ats-jobs:
    if: github.event.schedule == '30 2 * * *' || github.event.schedule == '30 14 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-ats-jobs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping. Set it once the site is deployed."
            exit 0
          fi
          # ATS API sync (Hyd/TG), twice daily. Partial runs advance a cursor.
          curl -s --max-time 65 -X GET "$SITE_URL/api/cron/sync-ats-jobs" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || true

  check-hiring:
    if: github.event.schedule == '0 3 * * *' || github.event.schedule == '0 15 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call check-hiring
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping. Set it once the site is deployed."
            exit 0
          fi
          # limit=30 twice daily (morning + evening IST). Cursor + 45s budget
          # advance leftovers to the next pass — more reliable than one limit=60.
          # || true: a 504 means Vercel timed out but may have processed partial
          # data — don't fail the workflow run over a partial cron.
          curl -s --max-time 65 -X GET "$SITE_URL/api/cron/check-hiring?limit=30" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || true

  fetch-news:
    if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call fetch-news
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping. Set it once the site is deployed."
            exit 0
          fi
          curl -sf -X GET "$SITE_URL/api/cron/fetch-news?limit=30" \
            -H "Authorization: Bearer $CRON_SECRET"

  adzuna-jobs:
    if: github.event.schedule == '0 */2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call adzuna-jobs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping. Set it once the site is deployed."
            exit 0
          fi
          # Incremental poll every 2h: merges new Hyd IT jobs into adzuna_latest
          # (Adzuna has no webhooks).
          curl -s --max-time 65 -X GET "$SITE_URL/api/cron/adzuna-jobs" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || true

  sync-priority-careers:
    if: github.event.schedule == '15 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-priority-careers
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping. Set it once the site is deployed."
            exit 0
          fi
          # Curated HTML/gap career pages (excludes boards already on sync-ats-jobs).
          curl -s --max-time 65 -X GET "$SITE_URL/api/cron/sync-priority-careers" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}" || true


  newsletter:
    if: github.event.schedule == '30 3 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call newsletter digest
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping. Set it once the site is deployed."
            exit 0
          fi
          curl -sf -X GET "$SITE_URL/api/cron/newsletter" \
            -H "Authorization: Bearer $CRON_SECRET"
