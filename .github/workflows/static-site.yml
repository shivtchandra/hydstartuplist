name: Static site (Cloudflare Pages)

# The whole site is built here as static files and served by Cloudflare Pages
# (free: no request or bandwidth limits). Vercel only serves /api/*, reached
# through the proxy in functions/api. Serving pages from Vercel (renders, ISR
# writes, origin transfer, CDN requests) exceeded the Hobby limits even at
# ~200 visits/day, because crawlers walk thousands of job/startup pages.
#
# Runs after the morning scrape batch, after the evening Adzuna pull, on pushes
# to master, and on demand. Deploys only once CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets exist; until then it just proves the build.
on:
  schedule:
    - cron: "15 7 * * *"
    - cron: "45 18 * * *"
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: static-site
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SITE_URL: https://startups.mapmyhyd.com
      NEXT_PUBLIC_SITE_URL: https://startups.mapmyhyd.com
      NEXT_PUBLIC_ADMIN_PASSCODE: ${{ secrets.NEXT_PUBLIC_ADMIN_PASSCODE }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_STADIA_KEY: ${{ vars.NEXT_PUBLIC_STADIA_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Build static site
        run: bash scripts/build-static.sh

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@4 pages project create mapmyhyd-startups --production-branch master || true
          npx --yes wrangler@4 pages deploy out --project-name mapmyhyd-startups --branch master --commit-dirty=true
