name = "startups-api"
main = "dist/index.js"
no_bundle = true
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]
# Reached through the startups Pages Function proxy (functions/api/[[path]].js).
workers_dev = true

[build]
command = "node build.mjs"

# Full scrape at 06:00 IST, then lightweight job-only refreshes at
# 11:00, 17:00, and 23:00 IST. scheduled() maps every non-morning slot
# to scope=jobs, so the extra runs skip Firecrawl-heavy company scans.
[triggers]
crons = ["30 0 * * *", "30 5 * * *", "30 11 * * *", "30 17 * * *"]

[observability]
enabled = true

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_SITE_URL = "https://startups.mapmyhyd.com"
SITE_URL = "https://startups.mapmyhyd.com"
NEXT_PUBLIC_FIREBASE_PROJECT_ID = "hydstartups-88207"
