name = "startups-api"
main = "dist/index.js"
no_bundle = true
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]
# Reached through the startups Pages Function proxy (functions/api/[[path]].js).
workers_dev = true

[build]
command = "node build.mjs"

# Dispatch the GitHub scrape on time once daily at 00:30 UTC (06:00 IST).
# See scheduled() in src/index.js.
[triggers]
crons = ["30 0 * * *"]

[observability]
enabled = true

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_SITE_URL = "https://startups.mapmyhyd.com"
SITE_URL = "https://startups.mapmyhyd.com"
NEXT_PUBLIC_FIREBASE_PROJECT_ID = "hydstartups-88207"
