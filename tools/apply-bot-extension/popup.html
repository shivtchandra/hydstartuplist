<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apply Copilot Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 350px;
      max-height: 540px;
      overflow-y: auto;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      font-size: 13px;
    }
    body::-webkit-scrollbar {
      width: 6px;
    }
    body::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #374151;
    }
    .header h2 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fbbf24;
    }
    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-save {
      width: 100%;
      background: #059669;
      color: #ffffff;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-save:hover { background: #047857; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 8px;
    }
    label {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 500;
    }
    input, textarea {
      background: #1f2937;
      border: 1px solid #374151;
      color: #f3f4f6;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .status {
      font-size: 11px;
      color: #10b981;
      text-align: center;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Apply Copilot</h2>
    <span style="font-size: 11px; color: #9ca3af;">Review-first autofill</span>
  </div>

  <button id="btn-fill" class="btn-primary">
    Review & Fill This Page (Alt+A)
  </button>

  <div class="row">
    <div class="field-group">
      <label>First Name</label>
      <input type="text" id="firstName" autocomplete="given-name">
    </div>
    <div class="field-group">
      <label>Last Name</label>
      <input type="text" id="lastName" autocomplete="family-name">
    </div>
  </div>

  <div class="field-group">
    <label>Full Name</label>
    <input type="text" id="fullName" autocomplete="name">
  </div>
  <div class="field-group">
    <label>Email</label>
    <input type="email" id="email" autocomplete="email">
  </div>
  <div class="field-group">
    <label>Phone</label>
    <input type="text" id="phone" autocomplete="tel">
  </div>
  <div class="field-group">
    <label>LinkedIn</label>
    <input type="text" id="linkedin" placeholder="https://linkedin.com/in/...">
  </div>
  <div class="field-group">
    <label>GitHub</label>
    <input type="text" id="github" placeholder="https://github.com/...">
  </div>
  <div class="field-group">
    <label>Portfolio / Website</label>
    <input type="text" id="portfolio" placeholder="https://...">
  </div>
  <div class="field-group">
    <label>Location</label>
    <input type="text" id="location" placeholder="Hyderabad, India">
  </div>
  <div class="field-group">
    <label>Notice Period</label>
    <input type="text" id="noticePeriod" placeholder="Immediate / 30 days">
  </div>

  <div class="row">
    <div class="field-group">
      <label>Current Company</label>
      <input type="text" id="currentCompany">
    </div>
    <div class="field-group">
      <label>Current Title</label>
      <input type="text" id="currentTitle">
    </div>
  </div>

  <div class="row">
    <div class="field-group">
      <label>Experience (Years)</label>
      <input type="text" id="experienceYears">
    </div>
    <div class="field-group">
      <label>Expected CTC</label>
      <input type="text" id="expectedCtc">
    </div>
  </div>

  <button id="btn-save" class="btn-save">Save Profile Updates</button>
  <div id="save-status" class="status">✓ Saved profile!</div>

  <script src="popup.js"></script>
</body>
</html>
